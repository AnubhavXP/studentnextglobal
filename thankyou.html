<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Studentnext Global</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            background: #f8fafc; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .success-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .success-box {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            max-width: 750px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }
        .success-image {
            flex: 0 0 220px;
            max-width: 220px;
        }
        .success-image img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            object-fit: cover;
        }
        .success-content {
            flex: 1;
            min-width: 250px;
        }
        .success-icon { 
            font-size: 2.5rem; 
            color: #10b981; 
            margin-bottom: 0.5rem; 
        }
        .success-content h2 { 
            color: #1a3a5c; 
            margin-bottom: 0.75rem; 
            font-size: 1.8rem; 
        }
        .success-content p { 
            color: #64748b; 
            margin-bottom: 1.5rem; 
            line-height: 1.6; 
        }

        /* Mobile stacking */
        @media (max-width: 650px) {
            .success-box { 
                flex-direction: column; 
                text-align: center; 
                padding: 2rem 1.5rem;
            }
            .success-image { 
                flex: 0 0 auto; 
                max-width: 180px; 
                margin-bottom: 1rem; 
            }
        }
    </style>
</head>
<body>
    <div class="success-wrapper">
        <div class="success-box">
            <div class="success-image">
                <!-- Replace src with your actual image path -->
                <img src="assets/images/thumbsup.png" alt="Orangutan in Fedora">
            </div>
            <div class="success-content">
                <div class="success-icon">✅</div>
                <h2>Message Sent Successfully!</h2>
                <p>Thank you for contacting Studentnext Global. We have received your inquiry and will get back to you within 24 hours.</p>
                <a href="index.html" class="btn-primary">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
